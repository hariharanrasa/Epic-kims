<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIMS Secret Command V9.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --neon-blue: #00d2ff; --neon-green: #39ff14; --neon-red: #ff3131; --glass: rgba(15, 23, 42, 0.6); }
        body { background: #020617; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; background-image: radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.05) 0%, transparent 20%); }
        .glass-panel { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8); }
        .glow-red { background: rgba(255, 49, 49, 0.2) !important; border: 1px solid var(--neon-red) !important; color: #fff !important; font-weight: 800; box-shadow: 0 0 10px rgba(255, 49, 49, 0.4); }
        .today { border: 1px solid var(--neon-blue) !important; background: rgba(0, 210, 255, 0.1); color: var(--neon-blue); }
        .calendar-day { font-family: 'Orbitron', sans-serif; }
        .news-ticker { background: rgba(0, 0, 0, 0.5); border-top: 1px solid var(--neon-blue); color: var(--neon-blue); font-family: 'Orbitron', sans-serif; font-size: 10px; }
    </style>
</head>
<body class="p-4 md:p-6 pb-24">

    <div class="flex justify-between items-start mb-6">
        <div>
            <h1 class="text-4xl font-black italic text-white tracking-tighter">Epic <span class="text-cyan-400">-Kims core</span></h1>
            <div class="flex items-center gap-2 mt-1">
                <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                <span class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Master Sync // V25.8</span>
            </div>
        </div>
        <div class="glass-panel p-3 text-center min-w-[100px]">
            <p id="curMonth" class="text-[8px] font-bold text-cyan-400 uppercase italic">MAY 2026</p>
            <p id="curDate" class="text-2xl font-bold calendar-day">01</p>
        </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 space-y-6">
            <div class="glass-panel p-6">
                <h2 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest">Monthly Calendar</h2>
                <div class="grid grid-cols-7 gap-2 text-center text-[10px] font-bold text-slate-500 mb-2">
                    <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
                </div>
                <div id="calendarGrid" class="grid grid-cols-7 gap-2 text-center text-[10px]"></div>
            </div>

            <div class="glass-panel p-6 border-l-4 border-cyan-500">
                <h2 class="text-xs font-black text-cyan-400 uppercase mb-4 tracking-widest flex items-center">
                    <i class="fa-solid fa-bell mr-2"></i> Day Reminders
                </h2>
                <div id="reminderList" class="space-y-3"></div>
            </div>
        </div>

        <div class="lg:col-span-2">
            <div class="glass-panel p-6 min-h-[500px]">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest">Approval Matrix</h2>
                    <div class="flex gap-4 text-[8px] font-bold">
                        <span class="flex items-center gap-1"><span class="w-2 h-2 bg-cyan-500 rounded-full"></span> Coord</span>
                        <span class="flex items-center gap-1"><span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Principal</span>
                    </div>
                </div>
                <div id="matrixGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 w-full news-ticker p-3 z-50 flex items-center">
        <span class="bg-cyan-600 text-black text-[8px] font-black px-2 py-1 mr-4">INFO</span>
        <marquee id="tickerText" behavior="scroll" direction="left">Syncing data from KIMS database...</marquee>
    </div>

    <script>
        const SHEET_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRr38rq1bjbVrWz7eCbIdM6uwqann_2tagAcvJJwfcDiS77epj842xuT0kyWvy0f2XCDFSJZH_EcJ2e/pub?output=csv";
        const CLASSES = ["X", "XI A", "XI B", "XII A", "XII B"];
        const SUBJECTS = ["Tamil", "English", "Maths", "Physics", "Chemistry", "Science", "Social", "Accountancy", "Commerce", "Economics", "Computer science", "Computer applications"];

        async function updateCommand() {
            try {
                const r = await fetch(SHEET_CSV);
                const text = await r.text();
                const rows = text.split('\n').map(row => row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));
                
                const now = new Date();
                const curMonth = now.getMonth() + 1;
                const curYear = now.getFullYear();

                let monthlyEvents = {};
                
                // DATA SCAN (Fixing Date Logic for M/D/Y)
                rows.slice(1).forEach(row => {
                    const dateRaw = row[2] || ""; 
                    const task = row[3] || "";
                    if(dateRaw.includes('/')) {
                        const parts = dateRaw.split('/');
                        // If Sheet is M/D/Y (5/20/2026) -> parts[0]=Month, parts[1]=Day
                        // If Sheet is D/M/Y (20/5/2026) -> parts[1]=Month, parts[0]=Day
                        let day, month, year;
                        if(parseInt(parts[0]) > 12) { // It's D/M/Y
                            day = parseInt(parts[0]); month = parseInt(parts[1]);
                        } else { // It's M/D/Y
                            day = parseInt(parts[1]); month = parseInt(parts[0]);
                        }
                        
                        if(month === curMonth) { monthlyEvents[day] = task; }
                    }
                });

                // RENDER CALENDAR
                const grid = document.getElementById('calendarGrid');
                const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
                const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
                grid.innerHTML = "";
                for(let i=0; i<firstDay; i++) grid.innerHTML += `<div></div>`;
                for(let i=1; i<=daysInMonth; i++) {
                    let style = monthlyEvents[i] ? 'glow-red' : 'text-slate-400';
                    if(i === now.getDate()) style += ' today';
                    grid.innerHTML += `<div class="p-2 rounded-lg border border-white/5 ${style}">${i}</div>`;
                }

                // RENDER REMINDERS
                const reminderList = document.getElementById('reminderList');
                reminderList.innerHTML = "";
                Object.keys(monthlyEvents).sort((a,b)=>a-b).forEach(d => {
                    reminderList.innerHTML += `
                        <div class="p-3 bg-white/5 rounded-xl border-l-2 border-cyan-500 flex justify-between">
                            <div><p class="text-[8px] text-cyan-400 font-bold uppercase">${d} MAY</p>
                            <p class="text-[10px] font-black uppercase text-white">${monthlyEvents[d]}</p></div>
                            <i class="fa-solid fa-circle-exclamation text-red-500 text-[10px] animate-pulse"></i>
                        </div>`;
                });

                // RENDER MATRIX (Combined)
                const latest = rows[rows.length - 1];
                document.getElementById('tickerText').innerText = "PRINCIPAL'S MSG: " + (latest[29] || "No updates.");
                const matrix = document.getElementById('matrixGrid');
                matrix.innerHTML = "";
                SUBJECTS.forEach((sub, i) => {
                    const cData = latest[5 + i] || "";
                    const pData = latest[17 + i] || "";
                    matrix.innerHTML += `
                        <div class="bg-white/5 border border-white/10 p-4 rounded-2xl">
                            <span class="text-[10px] font-black text-white italic uppercase">${sub}</span>
                            <div class="mt-2 space-y-2">
                                <div class="flex flex-wrap gap-1">${CLASSES.map(cls => `<span class="w-7 h-3.5 text-[6px] flex items-center justify-center rounded ${cData.includes(cls) ? 'bg-cyan-500 text-white font-bold' : 'bg-slate-800 text-slate-500'}">${cls}</span>`).join('')}</div>
                                <div class="flex flex-wrap gap-1">${CLASSES.map(cls => `<span class="w-7 h-3.5 text-[6px] flex items-center justify-center rounded ${pData.includes(cls) ? 'bg-emerald-500 text-white font-bold' : 'bg-slate-800 text-slate-500'}">${cls}</span>`).join('')}</div>
                            </div>
                        </div>`;
                });

            } catch (e) { console.error("Sync..."); }
        }

        updateCommand();
        setInterval(updateCommand, 30000);
    </script>
</body>
</html>
